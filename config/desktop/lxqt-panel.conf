panels=panel1

[panel1]
plugins=mainmenu,quicklaunch,desktopswitch,taskbar,statusnotifier,tray,mount,volume,worldclock,showdesktop
position=Bottom
desktop=0

[mainmenu]
type=mainmenu
filterClear=true

[desktopswitch]
type=desktopswitch

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray

[quicklaunch]
type=quicklaunch
apps\1\desktop=qterminal.desktop
apps\2\desktop=pcmanfm-qt.desktop
apps\3\desktop=lxqt-config.desktop
apps\size=3
