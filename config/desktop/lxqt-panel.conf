panels=panel1

[panel1]
plugins=mainmenu,taskbar,statusnotifier,tray,mount,volume,worldclock,showdesktop
position=Bottom
desktop=0

[mainmenu]
type=mainmenu
filterClear=true
icon=/opt/sirehos/assets/branding/SirehOS_Lite_Emblem.png

[taskbar]
type=taskbar
buttonStyle=2
showText=false
buttonWidth=48
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
